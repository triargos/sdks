name: Release Effect Procurat

on:
  push:
    branches: [main, next]
    paths:
      - 'packages/effect-procurat/**'
      - '.changeset/**'
      - '.github/workflows/release-effect-procurat.yml'

concurrency: ${{ github.workflow }}-${{ github.ref }}
permissions:
   id-token: write
   contents: read


jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PNPM
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: pnpm install

      - name: Build effect-procurat
        run: pnpm --filter @triargos/effect-procurat build

      - name: Enter prerelease mode (next branch only)
        if: github.ref == 'refs/heads/next'
        run: |
          if [ ! -f .changeset/pre.json ]; then
            npx changeset pre enter beta
          fi

      - name: Create Release Pull Request or Publish
        id: changesets
        uses: changesets/action@v1
        with:
          publish: pnpm release
          title: "chore(effect-procurat): version packages${{ github.ref == 'refs/heads/next' && ' (beta)' || '' }}"
          commit: "chore(effect-procurat): version packages${{ github.ref == 'refs/heads/next' && ' (beta)' || '' }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
